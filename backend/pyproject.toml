[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "firetwin"
version = "0.1.0"
description = "Coupled Multiphysics Fire, Smoke, and Structural-Thermal Hazard Simulation Platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "torch>=2.0.0",
    "numba>=0.57.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
